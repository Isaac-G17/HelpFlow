server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: support-ticket-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/helpflow}
    username: ${DB_USER:helpflow}
    password: ${DB_PASSWORD:helpflow}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 20
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
  http:
    client:
      # El RestClient.Builder autoconfigurado usa HttpURLConnection (simple) en vez del HttpClient del JDK,
      # que en algunos equipos Windows falla al arrancar ("Unable to establish loopback connection").
      factory: simple
      connect-timeout: 2s
      read-timeout: 3s

helpflow:
  jwt:
    # Clave Base64 de al menos 256 bits. En Docker/producción se sobrescribe con JWT_SECRET.
    secret: ${JWT_SECRET:aGVscGZsb3ctZGV2LXNlY3JldC1rZXktY2FtYmlhbWUtZW4tcHJvZHVjY2lvbi0yMDI2}
    expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}
  dispatch:
    base-url: ${DISPATCH_URL:http://localhost:8081}
  sla:
    # Un ticket está "próximo a incumplir" cuando le queda <= este porcentaje de su ventana de SLA.
    escalation-threshold-percent: 20
    scheduler-enabled: ${SLA_SCHEDULER_ENABLED:true}
    escalation-interval: PT5M

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      roles: ADMIN
  info:
    env:
      enabled: true
    java:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

info:
  app:
    name: support-ticket-service
    description: Servicio central de Tickets de Soporte TI - HelpFlow

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}
  level:
    com.helpflow: INFO
