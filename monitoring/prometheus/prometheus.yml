global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: support-ticket-service
    metrics_path: /actuator/prometheus
    # Credencial técnica (rol METRICS): solo sirve para /actuator/prometheus.
    basic_auth:
      username: prometheus
      password_file: /etc/prometheus/scraper_password
    static_configs:
      # Red interna de Docker: nombre del servicio, no localhost.
      - targets: ["support-ticket-service:8080"]
