name: helpflow

services:
  db:
    image: postgres:16-alpine
    container_name: helpflow-db
    environment:
      POSTGRES_DB: ${DB_NAME:-helpflow}
      POSTGRES_USER: ${DB_USER:-helpflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-helpflow}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - helpflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-helpflow} -d ${DB_NAME:-helpflow}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - helpflow-net

  technician-dispatch-service:
    build: ./technician-dispatch-service
    container_name: technician-dispatch-service
    ports:
      - "${DISPATCH_PORT:-8081}:8081"
    networks:
      - helpflow-net

  support-ticket-service:
    build: ./support-ticket-service
    container_name: support-ticket-service
    depends_on:
      db:
        condition: service_healthy
      technician-dispatch-service:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-helpflow}
      DB_USER: ${DB_USER:-helpflow}
      DB_PASSWORD: ${DB_PASSWORD:-helpflow}
      JWT_SECRET: ${JWT_SECRET:-aGVscGZsb3ctZG9ja2VyLXNlY3JldC1rZXktY2FtYmlhbWUtZW4tcHJvZHVjY2lvbi0yMDI2}
      # Por la red interna se usa el NOMBRE DEL SERVICIO, no localhost.
      DISPATCH_URL: http://technician-dispatch-service:8081
      # Credencial técnica con la que Prometheus lee /actuator/prometheus (HTTP Basic).
      METRICS_SCRAPER_PASSWORD: ${METRICS_SCRAPER_PASSWORD:-helpflow-metrics}
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - helpflow-net

  # ---------- Monitoreo: Prometheus lee /actuator/prometheus y Grafana lo muestra ----------
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: helpflow-prometheus
    depends_on:
      - support-ticket-service
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    configs:
      # La misma contraseña que recibe support-ticket-service (una sola fuente: METRICS_SCRAPER_PASSWORD).
      - source: scraper_password
        target: /etc/prometheus/scraper_password
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - helpflow-net

  grafana:
    image: grafana/grafana:11.4.0
    container_name: helpflow-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      # Acceso de solo lectura sin login para mostrar el dashboard; editar requiere el usuario admin.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/helpflow.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - helpflow-net

configs:
  scraper_password:
    content: ${METRICS_SCRAPER_PASSWORD:-helpflow-metrics}

networks:
  helpflow-net:
    driver: bridge

volumes:
  helpflow-data:
  prometheus-data:
  grafana-data:
